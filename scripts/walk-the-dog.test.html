<!doctype html>
<html><head><meta charset="utf-8"><title>walk-the-dog tests</title>
<style>
  body { font-family: "Courier New", monospace; padding: 20px; background: #f3ede0; }
  pre { background: #fff; padding: 12px; border: 1px solid #2b2520; white-space: pre-wrap; }
  .pass { color: #2a6a2a; }
  .fail { color: #a83a3a; }
  .summary { font-weight: bold; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<h1>walk-the-dog.threshold tests</h1>
<pre id="out">running…</pre>
<script type="module">
import { evaluateMark, ZONE } from './walk-the-dog.threshold.js';

const out = document.getElementById('out');
const results = [];
let passCount = 0, failCount = 0;
function test(name, fn) {
  try { fn(); results.push(`PASS  ${name}`); passCount++; }
  catch (e) { results.push(`FAIL  ${name}\n      ${e.message}`); failCount++; }
}
function eq(a, b) { if (a !== b) throw new Error(`expected ${b}, got ${a}`); }

// distance is normalized 0..1 where 1 = far, 0 = right next to the dog.
// Zones: unaware (1.0 - 0.7), aware (0.7 - 0.3), over-threshold (0.3 - 0).
test('returns UNAWARE when distraction is far', () => {
  eq(evaluateMark(0.9), ZONE.UNAWARE);
});
test('returns AWARE in the sweet spot (mid distance)', () => {
  eq(evaluateMark(0.5), ZONE.AWARE);
});
test('returns OVER when distraction is close', () => {
  eq(evaluateMark(0.1), ZONE.OVER);
});
test('boundary: 0.7 is start of AWARE', () => {
  eq(evaluateMark(0.7), ZONE.AWARE);
});
test('boundary: 0.3 is start of OVER', () => {
  eq(evaluateMark(0.3), ZONE.OVER);
});
test('clamps invalid input (> 1)', () => {
  eq(evaluateMark(1.5), ZONE.UNAWARE);
});
test('clamps invalid input (< 0)', () => {
  eq(evaluateMark(-1), ZONE.OVER);
});
test('ZONE constants are exported', () => {
  if (!ZONE.UNAWARE || !ZONE.AWARE || !ZONE.OVER) throw new Error('missing zone constants');
});

const summary = `\n${passCount} passed, ${failCount} failed`;
out.innerHTML = results.map(r =>
  r.startsWith('PASS') ? `<span class="pass">${r}</span>` : `<span class="fail">${r}</span>`
).join('\n') + `<div class="summary ${failCount ? 'fail' : 'pass'}">${summary}</div>`;
window.__testResults = { pass: passCount, fail: failCount };
</script>
</body></html>
