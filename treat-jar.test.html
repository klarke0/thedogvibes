<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>treat jar — test harness</title>
  <link rel="stylesheet" href="styles.css">
  <style>body { padding: 24px; max-width: 480px; } pre { font-size: 12px; }</style>
</head>
<body>
  <h1>treat jar — test harness</h1>

  <div class="v3-widget" id="widget-game">
    <div class="title">the treat jar</div>
    <div id="treat-jar-mount">Loading…</div>
  </div>

  <h2>trick distribution (1000 draws)</h2>
  <button id="run-dist" type="button">run</button>
  <pre id="dist-out"></pre>

  <script type="module" src="scripts/treat-jar.js"></script>
  <script type="module">
    import { pickTrick, TRICKS } from './scripts/treat-jar.tricks.js';
    document.getElementById('run-dist').addEventListener('click', () => {
      const N = 1000;
      const counts = Object.fromEntries(TRICKS.map(t => [t.id, 0]));
      for (let i = 0; i < N; i++) counts[pickTrick(Math.random).id]++;
      const total = TRICKS.reduce((s, t) => s + t.weight, 0);
      const lines = TRICKS.map(t => {
        const expected = (t.weight / total * 100).toFixed(1);
        const observed = (counts[t.id] / N * 100).toFixed(1);
        return `${t.id.padEnd(10)} expected ${expected}%  observed ${observed}%`;
      });
      document.getElementById('dist-out').textContent = lines.join('\n');
    });
  </script>
</body>
</html>
